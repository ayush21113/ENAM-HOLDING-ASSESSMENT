<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/finn_logo.png" />
    <link rel="apple-touch-icon" href="/finn_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE | ENAM Holdings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Instant 0ms Inline Splash Screen & Loading Progress -->
      <style>
        #splash-loader {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #0b0e14;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
          z-index: 99999;
          padding: 24px;
          user-select: none;
        }
        .splash-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 28px;
        }
        .splash-logo {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: linear-gradient(135deg, #00D09C 0%, #00875A 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: 900;
          font-size: 20px;
          box-shadow: 0 8px 24px rgba(0, 208, 156, 0.25);
        }
        .splash-title {
          font-size: 22px;
          font-weight: 800;
          letter-spacing: -0.5px;
          color: #ffffff;
        }
        .splash-sub {
          font-size: 11px;
          color: #8c909e;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 1px;
        }
        .progress-container {
          width: 100%;
          max-width: 240px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 999px;
          overflow: hidden;
          margin-bottom: 12px;
          position: relative;
        }
        .progress-bar {
          height: 100%;
          width: 0%;
          background: linear-gradient(90deg, #00D09C, #00ffbc);
          border-radius: 999px;
          transition: width 0.2s ease;
        }
        .progress-row {
          width: 100%;
          max-width: 280px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 11px;
          margin-bottom: 24px;
        }
        .progress-status {
          color: #8c909e;
          font-size: 11px;
        }
        .progress-pct {
          color: #00D09C;
          font-family: monospace;
          font-weight: 700;
        }
        .usp-card {
          width: 100%;
          max-width: 290px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 14px 16px;
          text-align: left;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
          animation: fadeIn 0.4s ease-out;
        }
        .usp-badge {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 10px;
          font-weight: 700;
          color: #00D09C;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-bottom: 6px;
        }
        .usp-title {
          color: #ffffff;
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 4px;
        }
        .usp-desc {
          color: #9da1b0;
          font-size: 11px;
          line-height: 1.4;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }
      </style>
      <div id="splash-loader">
        <div class="splash-brand">
          <div class="splash-logo">P</div>
          <div>
            <div class="splash-title">PULSE</div>
            <div class="splash-sub">ENAM Intelligence</div>
          </div>
        </div>

        <div class="progress-container">
          <div id="loading-bar" class="progress-bar"></div>
        </div>

        <div class="progress-row">
          <span id="loading-status" class="progress-status">Connecting to live feed...</span>
          <span id="loading-pct" class="progress-pct">0%</span>
        </div>

        <!-- Animated USP Showcase Card -->
        <div id="usp-container" class="usp-card">
          <div class="usp-badge">
            <span>✨</span> <span id="usp-tag">Institutional USP</span>
          </div>
          <div id="usp-title" class="usp-title">Management Reality Audit</div>
          <div id="usp-desc" class="usp-desc">Audits 4 quarters of forward guidance promises against actual financial results delivered.</div>
        </div>
      </div>
      <script>
        (function() {
          var p = 0;
          var bar = document.getElementById('loading-bar');
          var pct = document.getElementById('loading-pct');
          var st = document.getElementById('loading-status');
          var uTitle = document.getElementById('usp-title');
          var uDesc = document.getElementById('usp-desc');
          var uTag = document.getElementById('usp-tag');
          var uCard = document.getElementById('usp-container');

          var usps = [
            {
              tag: "USP 1 · Reality Audit",
              title: "Narrative vs. Numbers",
              desc: "Matches management forward guidance from past 4 quarters against actual BSE/NSE results with divergence scoring."
            },
            {
              tag: "USP 2 · Tone Forensics",
              title: "Concall Hot Seat",
              desc: "Strips scripted IR speeches to isolate unscripted analyst Q&A pressure points, tagging evasive responses."
            },
            {
              tag: "USP 3 · Regulatory Triage",
              title: "Zero-Noise Push Pipeline",
              desc: "Collapses 80% routine compliance filings; elevates high-conviction catalysts with instant QoQ/YoY extractions."
            },
            {
              tag: "USP 4 · Forensic Radar",
              title: "Primary Governance Scanner",
              desc: "Deep audit of Note 34 Related Party deals, Beneish M-score anomalies, and statutory auditor opinions."
            }
          ];

          var currentUspIdx = 0;
          setInterval(function() {
            currentUspIdx = (currentUspIdx + 1) % usps.length;
            if (uCard) {
              uCard.style.animation = 'none';
              uCard.offsetHeight; // trigger reflow
              uCard.style.animation = 'fadeIn 0.4s ease-out';
            }
            if (uTag) uTag.innerText = usps[currentUspIdx].tag;
            if (uTitle) uTitle.innerText = usps[currentUspIdx].title;
            if (uDesc) uDesc.innerText = usps[currentUspIdx].desc;
          }, 1800);

          var interval = setInterval(function() {
            if (p < 95) {
              p += Math.floor(Math.random() * 8) + 3;
              if (p > 95) p = 95;
              if (bar) bar.style.width = p + '%';
              if (pct) pct.innerText = p + '%';
              if (p > 25 && p <= 55 && st) st.innerText = "Auditing primary filings & concalls...";
              if (p > 55 && p <= 80 && st) st.innerText = "Calibrating guidance scorecards...";
              if (p > 80 && st) st.innerText = "Rendering mobile workspace...";
            }
          }, 140);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
